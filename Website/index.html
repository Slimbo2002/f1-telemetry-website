<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Home</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div class = "logo-combo">
                <img class="logo" src = "F1-Logo.png" alt ="logo-img">
                <h1>Telemetry</h1>
            </div>
            <div class = "navbar">
                <ul>
                    <li><a class = "active" href = "home.html">Home</a></li>
                    <li><a href = "Standings.html">Standings</a></li>
                </ul>
            </div>
       </header>

       <section class = "hero">
            <div class = "hero-text">
                <h1 id = "race-name"></h1>
                <div class ="hero-sub-text">
                    <h2 class = "track" id="race-location">Circuit de Monaco</h2> 
                    <h2 class = "date" id = "race-date"> 2-5th June 2026</h2>
                </div>
            </div>

            <div class = "info-blocks">
                <div class = "last-winner" id = "last-winner">
                </div>
                <div class = "standings">
                    <div class = "standing-table" id = "drivers_standings">
                        <h1 class = "standing-title">Driver Standings</h1>
                    </div>
                    <div class ="standing-table" id = "constructors_standings">
                        <h1 class = "standing-title">Constructors Standings</h1>
                    </div>
                </div>
            </div>
       </section>
       <section class = "calendar-overview">
            <div class = "title-dropdown">
                <h1 id = "year-title">2026 Season Calendar</h1>
                <select name = "years" class = "calendar-dropdown" id="calendar-dropdown"></select>
            </div>
            <div class = "calendar-carosel">
                <button class ="carosel-button carosel-button--left">&lt;</button>
                <div class = "carosel-viewport">
                    <ul id ="carosel-track" class="carosel-track">
                    </ul>
                </div>
                <button class ="carosel-button carosel-button--right">&gt;</button>
            </div>
       </section>
        <script type = "module" src = "home.js"></script>
    </body>
</html>
