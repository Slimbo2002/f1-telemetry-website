<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Home</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div class = "logo-combo">
                <img class="logo" src = "F1-Logo.png" alt ="logo-img">
                <h1>Telemetry</h1>
            </div>
            <div class = "navbar">
                <ul>
                    <li><a class = "active" href = "home.html">Home</a></li>
                    <li><a href = "">Seasons</a></li>
                    <li><a href = "">Standings</a></li>
                </ul>
            </div>
       </header>

       <section class = "hero">
            <div class = "hero-text">
                <h1>Monaco Grand Prix</h1>
                <div class ="hero-sub-text">
                    <h2 class = "track">Circuit de Monaco</h2> 
                    <h2 class = "date"> 2-5th June 2026</h2>
                </div>
            </div>

            <div class = "info-blocks">
                <div class = "info-one">
                    <div class ="lap-counter-live">
                        <h1 class ="live">LIVE</h1>
                        <h1>Lap 5/78</h1>
                    </div>
                    <div class ="timing-tower">
                        <div class = "timing-row">
                            <span class ="pos">1</span>
                            <span class = "driver">M Verstappen</span>
                            <span class ="gap">Leader</span>
                        </div>
                        <div class = "timing-row">
                            <span class ="pos">2</span>
                            <span class = "driver">O Piastri</span>
                            <span class ="gap">+0.434</span>
                        </div>
                        <div class = "timing-row">
                            <span class ="pos">3</span>
                            <span class = "driver">L Norris</span>
                            <span class ="gap">+2.544</span>
                        </div>
                        <div class = "timing-row">
                            <span class ="pos">4</span>
                            <span class = "driver">C Leclerc</span>
                            <span class ="gap">+5.343</span>
                        </div>
                        <div class = "timing-row">
                            <span class ="pos">5</span>
                            <span class = "driver">L Hamilton</span>
                            <span class ="gap">+6.565</span>
                        </div>
                    </div>
                    <a href = "home.html">
                        <button class ="live-button">Watch Now</button>
                    </a>
                </div>
                <div class = "standings">
                    <div class = "standing-table" id = "drivers_standings">
                        <h1 class = "standing-title">Driver Standings</h1>
                    </div>
                    <div class ="standing-table" id = "constructors_standings">
                        <h1 class = "standing-title">Constructors Standings</h1>
                    </div>
                </div>
            </div>
       </section>
       <section class = "calendar-overview">
            <h1>2026 Season Calendar</h1>
            <div class = "calendar-carosel">
                <button class ="carosel-button carosel-button--left">&lt;</button>
                <div class = "carosel-viewport">
                    <ul id ="carosel-track" class="carosel-track">
                    </ul>
                </div>
                <button class ="carosel-button carosel-button--right">&gt;</button>
            </div>
       </section>
        <script type = "module"src="historical_data.js"></script>
        <script type = "module" src = "home.js"></script>
    </body>
</html>
